name: sporty-edge sessions

on:
  schedule:
    # Two chances per session: pre-start + mid-window. Dedupe guard makes
    # double runs safe - the second run only logs picks the first missed.
    - cron: "40 5,9,13,17,21 * * *"    # 08:40 / 12:40 / 16:40 / 20:40 / 00:40 EAT
    - cron: "40 1,9,13,17,21 * * *"    # 04:40 / 12:40 / ... EAT (S6 + repeats)
    - cron: "25 7,11,15,19,23 * * *"   # 10:25 / 14:25 / 18:25 / 22:25 / 02:25 EAT
    - cron: "25 3 * * *"               # 06:25 EAT (S6 second chance)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Auto-settle previous session
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_KEYS: ${{ secrets.ODDS_API_KEYS }}
        run: python settle_auto.py

      - name: Singles (8 platforms, session-bound)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_KEYS: ${{ secrets.ODDS_API_KEYS }}
        run: python single_shot.py

      - name: Totals lane
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_KEYS: ${{ secrets.ODDS_API_KEYS }}
        run: python totals.py

      - name: Commit ledger + cache
        run: |
          git config user.name "edge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/bets.jsonl data/feed_cache.json || true
          git diff --cached --quiet || git commit -m "Session cycle [skip ci]"
          git push
