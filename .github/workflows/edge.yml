name: sporty-edge always-on

on:
  schedule:
    - cron: "*/30 * * * *"    # every 30 min - the orchestrator decides what to do
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: session-cycle
  cancel-in-progress: true    # never pile up overlapping runs

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Session cycle (settle + top-up picks)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_KEYS: ${{ secrets.ODDS_API_KEYS }}
        run: python session_cycle.py

      - name: Commit ledger + cache + state
        run: |
          git config user.name "edge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ || true
          git diff --cached --quiet || git commit -m "cycle [skip ci]"
          git push
