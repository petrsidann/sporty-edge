name: sporty-edge sessions

on:
  schedule:
    - cron: "0 3,10,15 * * *"     # 06:00 / 13:00 / 18:00 EAT
    - cron: "0 20 * * *"          # 23:00 EAT
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run SQUAD session (8 platforms x 2 picks)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_KEYS: ${{ secrets.ODDS_API_KEYS }}
        run: python squad.py

      - name: Commit ledger + cache
        run: |
          git config user.name "edge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/bets.jsonl data/feed_cache.json || true
          git diff --cached --quiet || git commit -m "Squad ledger [skip ci]"
          git push
