name: sporty-edge sessions

on:
  schedule:
    - cron: "10 6,10,14,18,22 * * *"   # 09:10 / 13:10 / 17:10 / 21:10 / 01:10 EAT
    - cron: "10 2 * * *"               # 05:10 EAT (S6)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Auto-settle previous session
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_KEYS: ${{ secrets.ODDS_API_KEYS }}
        run: python settle_auto.py

      - name: Singles (8 platforms, session-bound)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_KEYS: ${{ secrets.ODDS_API_KEYS }}
        run: python single_shot.py

      - name: Totals lane (O/U specialist)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_KEYS: ${{ secrets.ODDS_API_KEYS }}
        run: python totals.py

      - name: Commit ledger + cache
        run: |
          git config user.name "edge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/bets.jsonl data/feed_cache.json || true
          git diff --cached --quiet || git commit -m "Session cycle [skip ci]"
          git push
